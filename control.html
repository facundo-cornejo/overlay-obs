<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control Maestro</title>
    <!-- Firebase SDK (App, Database & Auth) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: #2d2d2d; padding: 12px; border-radius: 10px; border: 1px solid #444; }
        .full-width { grid-column: 1 / span 2; }
        h3 { margin-top: 0; color: #0097b2; text-transform: uppercase; font-size: 12px; margin-bottom: 8px; }
        input, select { width: 92%; padding: 8px; margin: 5px 0; border-radius: 4px; border: 1px solid #444; background: #111; color: white; font-size: 13px; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn-main { background: #0097b2; color: white; width: 100%; margin-top: 5px; }
        .score-monitor { font-size: 24px; font-weight: 900; color: #2ecc71; background: #111; padding: 5px 15px; border-radius: 5px; border: 1px solid #444; display: inline-block; margin-bottom: 5px; }
        .btn-reset { background: #e74c3c; color: white; width: 100%; margin-top: 8px; font-size: 10px; text-transform: uppercase; }
        .btn-toggle { background: #444; color: white; width: 31%; font-size: 10px; }
        .on { background: #0097b2 !important; box-shadow: 0 0 10px rgba(0,151,178,0.5); }
        .on-orange { background: #e67e22 !important; }
        .on-purple { background: #9b59b6 !important; }
        .time-setter { display: flex; gap: 5px; align-items: center; margin-top: 8px; }
        .time-setter input { width: 45px; text-align: center; margin: 0; padding: 5px; }
        .btn-set { background: #f1c40f; color: #000; font-size: 10px; flex-grow: 1; padding: 6px; }
        .btn-search { background: #0097b2; color: white; padding: 8px; border: none; border-radius: 4px; font-size: 11px; white-space: nowrap; }

        /* Pantalla de Autenticación */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; z-index: 99999; display: flex;
            justify-content: center; align-items: center;
        }
        .login-box {
            background: #222; padding: 30px; border-radius: 12px;
            border: 1px solid #0097b2; width: 300px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .login-box input { width: 90%; margin-bottom: 12px; }
        .login-box button { width: 100%; background: #0097b2; color: white; margin-top: 10px; }
        #authError { color: #e74c3c; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- Modal de Inicio de Sesión Obligatorio -->
    <div id="authOverlay">
        <div class="login-box">
            <h3 style="font-size: 16px; margin-bottom: 15px;">Acceso Autorizado</h3>
            <input type="email" id="authEmail" placeholder="Correo Electrónico">
            <input type="password" id="authPass" placeholder="Contraseña">
            <button onclick="login()">INGRESAR</button>
            <div id="authError">Credenciales incorrectas</div>
        </div>
    </div>

    <div class="card full-width" style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0;">Visibilidad de Pantalla</h3>
        <button onclick="logout()" style="background: #e74c3c; color: white; font-size: 10px; padding: 5px 10px;">CERRAR SESIÓN</button>
    </div>

    <!-- NUEVO: Selector de Resolución -->
    <div class="card full-width">
        <h3>Resolución del Lienzo (Master)</h3>
        <select id="resolution" onchange="sync()">
            <option value="1080p">Full HD (1920 x 1080)</option>
            <option value="720p">HD (1280 x 720) - Móviles / PRISM</option>
            <option value="4k">4K (3840 x 2160)</option>
            <option value="auto">Adaptable Automático (Auto Scale)</option>
        </select>
    </div>

    <div class="card full-width" style="text-align: center;">
        <div style="display: flex; gap: 8px; justify-content: center;">
            <button id="introBtn" onclick="toggleIntro()" class="btn-toggle">PLACA INICIO</button>
            <button id="scoreBtn" onclick="toggleScore()" class="btn-toggle on">MARCADOR</button>
            <button id="ltBtn" onclick="toggleLT()" class="btn-toggle">ZÓCALO</button>
        </div>
    </div>

    <div class="card">
        <h3>Local <span id="monitorA" class="score-monitor">0</span></h3>
        <input type="text" id="nameA" placeholder="Nombre Local" value="LOCAL" onkeyup="sync()" onchange="sync()">
        <input type="text" id="logoA" placeholder="URL Logo Local (Opcional)" onkeyup="sync()" onchange="sync()">
        <div style="display: flex; gap: 5px;">
            <button onclick="changeScore('scoreA', 1)" style="background:#2ecc71; color:white; flex: 2;">+ GOL</button>
            <button onclick="changeScore('scoreA', -1)" style="background:#e74c3c; color:white; flex: 1;">-</button>
        </div>
    </div>

    <div class="card">
        <h3>Visita <span id="monitorB" class="score-monitor">0</span></h3>
        <input type="text" id="nameB" placeholder="Nombre Visita" value="VISITA" onkeyup="sync()" onchange="sync()">
        <input type="text" id="logoB" placeholder="URL Logo Visita (Opcional)" onkeyup="sync()" onchange="sync()">
        <div style="display: flex; gap: 5px;">
            <button onclick="changeScore('scoreB', 1)" style="background:#2ecc71; color:white; flex: 2;">+ GOL</button>
            <button onclick="changeScore('scoreB', -1)" style="background:#e74c3c; color:white; flex: 1;">-</button>
        </div>
    </div>

    <div class="card full-width">
        <h3>Información Extra y Anuncio</h3>
        <input type="text" id="extraLT" placeholder="Zócalo Extra (Estadio, Torneo, etc.)" onkeyup="sync()" onchange="sync()">
        <input type="text" id="genericText" placeholder="Anuncio Genérico" onkeyup="sync()" onchange="sync()">
        <button id="genericBtn" onclick="toggleGeneric()" class="btn-toggle" style="width: 100%; margin-top: 5px;">MOSTRAR ANUNCIO</button>
    </div>

    <div class="card full-width">
        <h3>Reloj y Período</h3>
        <div style="display: flex; gap: 10px;">
            <select id="period" onchange="sync()" style="flex: 1;">
                <option value="1T">1ER TIEMPO</option>
                <option value="ENTRETIEMPO">ENTRETIEMPO</option>
                <option value="2T">2DO TIEMPO</option>
                <option value="FIN">RESULTADO FINAL</option>
                <option value="A CONTINUACIÓN">A CONTINUACIÓN</option>
            </select>
            <button onclick="toggleTimer()" class="btn-main" id="tBtn" style="flex: 2; margin: 0;">INICIAR TIEMPO</button>
        </div>
        
        <div class="time-setter">
            <input type="number" id="manualMin" placeholder="Min">
            <input type="number" id="manualSec" placeholder="Seg">
            <button onclick="setManualTime()" class="btn-set">SALTAR A ESTE TIEMPO</button>
        </div>

        <button onclick="resetTimer()" class="btn-reset">RESET INTELIGENTE (TIEMPOS)</button>
    </div>
    
    <div class="card full-width">
        <h3>Sede y Clima Autodetectado</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 5px; align-items: center;">
            <input type="text" id="city" placeholder="Ciudad (ej: Santa Rosa)" style="flex: 2; margin: 0;">
            <button onclick="fetchWeather()" class="btn-search">BUSCAR CLIMA</button>
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="temp" placeholder="Temp (ej: 22°C)" style="flex: 1;" onkeyup="sync()" onchange="sync()">
            <input type="text" id="weatherDesc" placeholder="Estado (ej: Soleado)" style="flex: 2;" onkeyup="sync()" onchange="sync()">
        </div>
        
        <button id="weatherBtn" onclick="toggleWeather()" class="btn-toggle" style="width: 100%; margin-top: 8px;">
            MOSTRAR / OCULTAR CLIMA
        </button>
    </div>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDDAfPTP5TtNe5kn6ME2JybFqBDq1ATslY",
            authDomain: "marcador-obs-6c60b.firebaseapp.com",
            databaseURL: "https://marcador-obs-6c60b-default-rtdb.firebaseio.com",
            projectId: "marcador-obs-6c60b",
            storageBucket: "marcador-obs-6c60b.firebasestorage.app",
            messagingSenderId: "411268546632",
            appId: "1:411268546632:web:67778b081df1d35e1e587d",
            measurementId: "G-257GQPG41H"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('score_data');
        const auth = firebase.auth();

        let data = {
            nameA: "LOCAL", scoreA: 0, logoA: "",
            nameB: "VISITA", scoreB: 0, logoB: "",
            seconds: 0, running: false, period: "1T",
            showLT: false, showScore: true, showIntro: false,
            city: "", temp: "", weatherDesc: "", showWeather: false,
            genericText: "", showGeneric: false, extraLT: "",
            resolution: "1080p"
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                loadFirebaseData();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        });

        function login() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;
            const errDiv = document.getElementById('authError');

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { errDiv.style.display = 'none'; })
                .catch((error) => {
                    errDiv.innerText = "Error: " + error.message;
                    errDiv.style.display = 'block';
                });
        }

        function logout() { auth.signOut(); }

        const weatherCodeMap = {
            0: "Despejado", 1: "Mayormente despejado", 2: "Parcialmente nublado", 3: "Nublado",
            45: "Niebla", 48: "Niebla con escarcha", 51: "Llovizna ligera", 53: "Llovizna moderada",
            55: "Llovizna intensa", 61: "Lluvia ligera", 63: "Lluvia moderada", 65: "Lluvia fuerte",
            71: "Nieve ligera", 73: "Nieve moderada", 75: "Nieve fuerte", 80: "Chubascos ligeros",
            81: "Chubascos moderados", 82: "Chubascos intensos", 95: "Tormenta eléctrica",
            96: "Tormenta con granizo", 99: "Tormenta fuerte con granizo"
        };

        async function fetchWeather() {
            const cityName = document.getElementById('city').value.trim();
            if (!cityName) { alert("Por favor escribe el nombre de una ciudad."); return; }

            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=es&format=json`);
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) { alert("No se encontró la ciudad ingresada."); return; }

                const { latitude, longitude, name } = geoData.results[0];
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                const weatherData = await weatherRes.json();

                if (weatherData.current_weather) {
                    const temp = Math.round(weatherData.current_weather.temperature);
                    const code = weatherData.current_weather.weathercode;
                    const desc = weatherCodeMap[code] || "Tiempo estable";
                    document.getElementById('city').value = name.toUpperCase();
                    document.getElementById('temp').value = `${temp}°C`;
                    document.getElementById('weatherDesc').value = desc.toUpperCase();
                    sync();
                }
            } catch (err) {
                console.error("Error consultando el clima:", err);
                alert("No se pudieron obtener los datos automáticos del clima.");
            }
        }

        function sync() {
            if (!auth.currentUser) return;

            data.nameA = document.getElementById('nameA').value || "LOCAL";
            data.nameB = document.getElementById('nameB').value || "VISITA";
            data.logoA = document.getElementById('logoA').value || "";
            data.logoB = document.getElementById('logoB').value || "";
            data.period = document.getElementById('period').value;
            data.extraLT = document.getElementById('extraLT').value || "";
            data.genericText = document.getElementById('genericText').value || "";
            data.city = document.getElementById('city').value || "";
            data.temp = document.getElementById('temp').value || "";
            data.weatherDesc = document.getElementById('weatherDesc').value || "";
            data.resolution = document.getElementById('resolution').value || "1080p";

            document.getElementById('monitorA').innerText = data.scoreA;
            document.getElementById('monitorB').innerText = data.scoreB;

            document.getElementById('introBtn').className = data.showIntro ? 'btn-toggle on-purple' : 'btn-toggle';
            document.getElementById('scoreBtn').className = data.showScore ? 'btn-toggle on' : 'btn-toggle';
            document.getElementById('ltBtn').className = data.showLT ? 'btn-toggle on-orange' : 'btn-toggle';
            document.getElementById('weatherBtn').className = data.showWeather ? 'btn-toggle on' : 'btn-toggle';
            document.getElementById('genericBtn').className = data.showGeneric ? 'btn-toggle on' : 'btn-toggle';
            document.getElementById('tBtn').innerText = data.running ? 'PAUSAR TIEMPO' : 'CONTINUAR TIEMPO';

            db.set(data);
        }

        function setManualTime() {
            const m = parseInt(document.getElementById('manualMin').value) || 0;
            const s = parseInt(document.getElementById('manualSec').value) || 0;
            data.seconds = (m * 60) + s;
            sync();
        }

        function resetTimer() {
            let nextPeriod = data.period;
            if (data.period === "1T") nextPeriod = "ENTRETIEMPO";
            else if (data.period === "ENTRETIEMPO") nextPeriod = "2T";
            else if (data.period === "2T") nextPeriod = "FIN";
            else if (data.period === "A CONTINUACIÓN") nextPeriod = "1T";

            if(confirm(`¿Pasar estado a: ${nextPeriod}?`)) {
                data.seconds = 0; data.running = false; data.period = nextPeriod;
                document.getElementById('period').value = nextPeriod;
                sync();
            }
        }

        function toggleIntro() { data.showIntro = !data.showIntro; sync(); }
        function toggleScore() { data.showScore = !data.showScore; sync(); }
        function toggleLT() { data.showLT = !data.showLT; sync(); }
        function toggleWeather() { data.showWeather = !data.showWeather; sync(); }
        function toggleGeneric() { data.showGeneric = !data.showGeneric; sync(); }
        function changeScore(t, v) { data[t] = Math.max(0, data[t]+v); sync(); }
        function toggleTimer() { data.running = !data.running; sync(); }

        setInterval(() => { if(data.running){ data.seconds++; sync(); } }, 1000);

        function loadFirebaseData() {
            db.once('value', (snapshot) => {
                const val = snapshot.val();
                if(val) {
                    data = val;
                    document.getElementById('nameA').value = data.nameA || "";
                    document.getElementById('nameB').value = data.nameB || "";
                    document.getElementById('logoA').value = data.logoA || "";
                    document.getElementById('logoB').value = data.logoB || "";
                    document.getElementById('period').value = data.period || "1T";
                    document.getElementById('extraLT').value = data.extraLT || "";
                    document.getElementById('genericText').value = data.genericText || "";
                    document.getElementById('city').value = data.city || "";
                    document.getElementById('temp').value = data.temp || "";
                    document.getElementById('weatherDesc').value = data.weatherDesc || "";
                    document.getElementById('resolution').value = data.resolution || "1080p";
                    sync();
                }
            });
        }
    </script>
</body>
</html>
