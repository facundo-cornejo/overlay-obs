<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --principal: #26406C;
            --color-texto: #ffffff;
            --cyan: #15A6B9;
            --lavanda: #757ABA;
            --font-family: 'Montserrat', sans-serif;
        }

        body { margin: 0; background: transparent; overflow: hidden; font-family: var(--font-family); }
        #container { width: 1920px; height: 1080px; position: relative; }

        /* Zócalo Institucional */
        #zocalo {
            position: absolute; bottom: 80px; left: 80px;
            display: none; transition: 0.5s ease-in-out;
            animation: slideIn 0.5s forwards;
        }
        .content {
            background: var(--principal); color: var(--color-texto);
            padding: 15px 40px; border-left: 10px solid var(--cyan); 
            border-bottom: 5px solid var(--lavanda);
            box-shadow: 10px 10px 30px rgba(0,0,0,0.4);
        }
        #t { margin: 0; font-size: 42px; text-transform: uppercase; color: var(--color-texto); }
        #st { margin: 5px 0 0; font-size: 24px; text-transform: uppercase; font-weight: 300; opacity: 0.9; color: var(--color-texto); }

        /* Cabecera Derecha */
        #header-right { position: absolute; top: 50px; right: 80px; display: flex; align-items: center; gap: 20px; }
        
        #badge-vivo { 
            background: #ff0000; color: white; padding: 8px 20px; 
            font-weight: bold; font-size: 22px; display: none;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
            animation: pulse 2s infinite linear;
        }
        #logo { height: 80px; display: none; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }

        /* Pantalla de Espera */
        #pantalla-espera {
            position: absolute; top: 0; left: 0;
            width: 1920px; height: 1080px;
            background: rgba(38, 64, 108, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }
        .espera-box {
            text-align: center; background: var(--principal);
            padding: 40px 80px; border-bottom: 8px solid var(--cyan);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }
        #txt-espera { font-size: 60px; color: white; margin: 0; text-transform: uppercase; letter-spacing: 3px; }
        .espera-linea { height: 4px; background: var(--lavanda); width: 50%; margin: 20px auto 0; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="container">
        <div id="header-right">
            <div id="badge-vivo">VIVO</div>
            <img id="logo" src="">
        </div>
        <div id="zocalo">
            <div class="content">
                <h1 id="t"></h1>
                <p id="st"></p>
            </div>
        </div>
        <div id="pantalla-espera">
            <div class="espera-box">
                <h2 id="txt-espera">EL EVENTO COMENZARÁ EN BREVE</h2>
                <div class="espera-linea"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDDAfPTP5TtNe5kn6ME2JybFqBDq1ATslY",
            authDomain: "marcador-obs-6c60b.firebaseapp.com",
            databaseURL: "https://marcador-obs-6c60b-default-rtdb.firebaseio.com",
            projectId: "marcador-obs-6c60b",
            storageBucket: "marcador-obs-6c60b.firebasestorage.app",
            messagingSenderId: "411268546632",
            appId: "1:411268546632:web:67778b081df1d35e1e587d",
            measurementId: "G-257GQPG41H"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('score_data');

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if(!data) return;

            document.getElementById('t').innerText = data.h_titulo || '';
            document.getElementById('st').innerText = data.h_subtitulo || '';
            document.getElementById('st').style.display = data.h_subtitulo ? 'block' : 'none';

            document.documentElement.style.setProperty('--principal', data.h_colorMain || '#26406C');
            document.documentElement.style.setProperty('--color-texto', data.h_colorText || '#ffffff');
            document.documentElement.style.setProperty('--font-family', data.h_font || "'Montserrat', sans-serif");

            document.getElementById('zocalo').style.display = data.h_zocaloVis ? 'block' : 'none';
            document.getElementById('badge-vivo').style.display = data.h_vivoVis ? 'block' : 'none';
            document.getElementById('badge-vivo').innerText = data.h_vivoTxt || 'VIVO';

            const logo = document.getElementById('logo');
            if (data.h_logoUrl) logo.src = data.h_logoUrl;
            logo.style.display = (data.h_logoVis && data.h_logoUrl) ? 'block' : 'none';

            const espera = document.getElementById('pantalla-espera');
            espera.style.display = data.h_esperaVis ? 'flex' : 'none';
            if(data.h_esperaTxt) document.getElementById('txt-espera').innerText = data.h_esperaTxt;
        });
    </script>
</body>
</html>
