<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --principal: #26406C;
            --color-texto: #ffffff;
            --cyan: #15A6B9;
            --lavanda: #757ABA;
        }

        body { 
            margin: 0; 
            padding: 0;
            background: transparent; 
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif; 
        }

        #container { width: 1920px; height: 1080px; position: relative; }

        /* Zócalo Institucional */
        #zocalo {
            position: absolute; 
            bottom: 80px; 
            left: 80px;
            display: none; 
            transition: all 0.3s ease-in-out;
            animation: slideIn 0.5s forwards;
            z-index: 10;
        }

        .content {
            background-color: var(--principal); 
            color: var(--color-texto);
            padding: 20px 45px; 
            border-left: 10px solid var(--cyan); 
            border-bottom: 6px solid var(--lavanda);
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            min-width: 300px;
        }

        #t { 
            margin: 0; 
            font-size: 42px; 
            text-transform: uppercase; 
            color: var(--color-texto);
            font-weight: 700;
            line-height: 1.1;
        }

        #st { 
            margin: 8px 0 0 0; 
            font-size: 24px; 
            text-transform: uppercase; 
            font-weight: 400; 
            opacity: 0.95; 
            color: var(--color-texto); 
        }

        /* Cabecera Derecha */
        #header-right { 
            position: absolute; 
            top: 50px; 
            right: 80px; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            z-index: 20;
        }
        
        #badge-vivo { 
            background: #ff0000; 
            color: white; 
            padding: 8px 22px; 
            font-weight: bold; 
            font-size: 22px; 
            display: none;
            box-shadow: 0 0 15px rgba(255,0,0,0.5);
            border-radius: 4px;
            animation: pulse 2s infinite linear;
        }

        #logo { 
            height: 85px; 
            display: none; 
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4)); 
            object-fit: contain;
        }

        /* Pantalla de Espera */
        #pantalla-espera {
            position: absolute; 
            top: 0; 
            left: 0;
            width: 1920px; 
            height: 1080px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none; 
            justify-content: center; 
            align-items: center;
            z-index: 100;
        }

        .espera-box {
            text-align: center; 
            background: var(--principal);
            padding: 50px 90px; 
            border-bottom: 8px solid var(--cyan);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            animation: fadeIn 0.4s ease;
            max-width: 1200px;
        }

        #txt-espera { 
            font-size: 55px; 
            color: var(--color-texto); 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-weight: 700;
        }

        .espera-linea { 
            height: 5px; 
            background: var(--lavanda); 
            width: 60%; 
            margin: 25px auto 0; 
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="container">
        <div id="header-right">
            <div id="badge-vivo">VIVO</div>
            <img id="logo" src="" alt="Logo">
        </div>

        <div id="zocalo">
            <div class="content">
                <h1 id="t"></h1>
                <p id="st"></p>
            </div>
        </div>

        <div id="pantalla-espera">
            <div class="espera-box">
                <h2 id="txt-espera">EL EVENTO COMENZARÁ EN BREVE</h2>
                <div class="espera-linea"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDDAfPTP5TtNe5kn6ME2JybFqBDq1ATslY",
            authDomain: "marcador-obs-6c60b.firebaseapp.com",
            databaseURL: "https://marcador-obs-6c60b-default-rtdb.firebaseio.com",
            projectId: "marcador-obs-6c60b",
            storageBucket: "marcador-obs-6c60b.firebasestorage.app",
            messagingSenderId: "411268546632",
            appId: "1:411268546632:web:67778b081df1d35e1e587d",
            measurementId: "G-257GQPG41H"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('score_data');

        db.on('value', (snapshot) => {
            const data = snapshot.val() || {};

            // Restablecer estilos visuales asegurando valores por defecto
            const bg = data.h_colorMain || '#26406C';
            const colorText = data.h_colorText || '#ffffff';
            const fontChoice = (data.h_font || "Montserrat").replace(/'/g, "");

            document.documentElement.style.setProperty('--principal', bg);
            document.documentElement.style.setProperty('--color-texto', colorText);
            document.body.style.fontFamily = `${fontChoice}, sans-serif`;

            // Textos del Zócalo
            const titulo = data.h_titulo || '';
            const subtitulo = data.h_subtitulo || '';
            document.getElementById('t').innerText = titulo;
            document.getElementById('st').innerText = subtitulo;
            document.getElementById('st').style.display = subtitulo ? 'block' : 'none';

            // Visibilidad Zócalo
            const zocalo = document.getElementById('zocalo');
            zocalo.style.display = (data.h_zocaloVis && titulo) ? 'block' : 'none';

            // Indicador VIVO
            const badgeVivo = document.getElementById('badge-vivo');
            badgeVivo.innerText = data.h_vivoTxt || 'VIVO';
            badgeVivo.style.display = data.h_vivoVis ? 'block' : 'none';

            // Logo
            const logo = document.getElementById('logo');
            if (data.h_logoUrl) {
                logo.src = data.h_logoUrl;
                logo.style.display = data.h_logoVis ? 'block' : 'none';
            } else {
                logo.style.display = 'none';
            }

            // Pantalla de Espera
            const espera = document.getElementById('pantalla-espera');
            const txtEspera = document.getElementById('txt-espera');
            espera.style.display = data.h_esperaVis ? 'flex' : 'none';
            txtEspera.innerText = data.h_esperaTxt || 'EL EVENTO COMENZARÁ EN BREVE';
        });
    </script>
</body>
