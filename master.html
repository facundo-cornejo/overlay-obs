<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Overlay System</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            width: 1920px; 
            height: 1080px; 
            background: transparent; 
            overflow: hidden; 
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Todos los módulos visuales originales -->
    <iframe src="overlay.html" id="frame_score"></iframe>
    <iframe src="lower_third.html" id="frame_lt"></iframe>
    <iframe src="weather.html" id="frame_weather"></iframe>
    <iframe src="generic.html" id="frame_generic"></iframe>
    <iframe src="intro_placa.html" id="frame_intro_placa"></iframe>
    <iframe src="intro.html" id="frame_intro"></iframe>

    <script>
        // CONFIGURACIÓN DE TU PROYECTO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDDAfPTP5TtNe5kn6ME2JybFqBDq1ATslY",
            authDomain: "marcador-obs-6c60b.firebaseapp.com",
            databaseURL: "https://marcador-obs-6c60b-default-rtdb.firebaseio.com",
            projectId: "marcador-obs-6c60b",
            storageBucket: "marcador-obs-6c60b.firebasestorage.app",
            messagingSenderId: "411268546632",
            appId: "1:411268546632:web:67778b081df1d35e1e587d",
            measurementId: "G-257GQPG41H"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('score_data');

        // Canal de transmisión local de respaldo
        const bc = new BroadcastChannel('sistema_obs');

        function broadcastToIframes(data) {
            if (!data) return;
            
            // 1. Guardar copia en localStorage por si un iframe reinicia
            localStorage.setItem('score_master', JSON.stringify(data));

            // 2. Transmitir el paquete de datos a todos los iframes cargados
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(frame => {
                if (frame.contentWindow) {
                    frame.contentWindow.postMessage(data, '*');
                }
            });
        }

        // Escuchar datos en tiempo real desde la nube (Firebase)
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            broadcastToIframes(data);
        });

        // Respaldar también por si envías órdenes desde la misma PC mediante BroadcastChannel
        bc.onmessage = (event) => {
            broadcastToIframes(event.data);
        };

        console.log("Master System: Puente de Firebase & BroadcastChannel activo...");
    </script>
</body>
</html>
