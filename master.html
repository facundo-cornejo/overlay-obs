<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Overlay Integrado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 1920px; 
            height: 1080px; 
            overflow: hidden; 
            background: transparent; 
            position: relative;
        }
        iframe { 
            width: 1920px; 
            height: 1080px; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            pointer-events: none; 
            background: transparent;
        }
        /* Capa institucional por encima del marcador deportivo */
        #overlay-deportes { z-index: 1; }
        #overlay-humanas { z-index: 2; }
    </style>
</head>
<body>

    <!-- Capa 1: Deportes / Marcador -->
    <iframe id="overlay-deportes" src="overlay.html"></iframe>

    <!-- Capa 2: Módulo Humanas / Institucional -->
    <iframe id="overlay-humanas" src="overlay_humanas.html"></iframe>

</body>
</html>
