<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Overlay Integrado</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        html, body { 
            width: 1920px; 
            height: 1080px; 
            overflow: hidden; 
            background: transparent; 
            position: relative;
        }
        iframe { 
            width: 1920px; 
            height: 1080px; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            pointer-events: none; 
            background: transparent;
        }

        /* --- ORDEN DE CAPAS / JERARQUÍA VISUAL (Z-INDEX) --- */
        #layer-lower-third { z-index: 10; }
        #layer-overlay     { z-index: 20; }
        #layer-humanas     { z-index: 30; }
        #layer-weather     { z-index: 40; }
        #layer-generic     { z-index: 50; }
        #layer-intro       { z-index: 60; }
    </style>
</head>
<body>

    <!-- 1. Zócalo Deportivo Extra -->
    <iframe id="layer-lower-third" src="lower_third.html"></iframe>

    <!-- 2. Marcador Deportivo Base (Local, Visita, Reloj) -->
    <iframe id="layer-overlay" src="overlay.html"></iframe>

    <!-- 3. Módulo Institucional Humanas (Zócalo, Logo, Vivo, Espera) -->
    <iframe id="layer-humanas" src="overlay_humanas.html"></iframe>

    <!-- 4. Clima -->
    <iframe id="layer-weather" src="weather.html"></iframe>

    <!-- 5. Anuncio Genérico -->
    <iframe id="layer-generic" src="generic.html"></iframe>

    <!-- 6. Placa de Inicio / Intro -->
    <iframe id="layer-intro" src="intro_placa.html"></iframe>

</body>
</html>
