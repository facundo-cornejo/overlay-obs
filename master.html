<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Master Overlay System</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            width: 100vw; 
            height: 100vh; 
            background: transparent; 
            overflow: hidden; 
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }

        /* Contenedor virtual que siempre mantiene la relación nativa 1920x1080 */
        #stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            transform-origin: top left;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            background: transparent;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="stage">
        <!-- Capas / Módulos de la transmisión -->
        <iframe src="overlay.html" id="frame_score"></iframe>
        <iframe src="lower_third.html" id="frame_lt"></iframe>
        <iframe src="weather.html" id="frame_weather"></iframe>
        <iframe src="generic.html" id="frame_generic"></iframe>
        <iframe src="intro_placa.html" id="frame_intro_placa"></iframe>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDDAfPTP5TtNe5kn6ME2JybFqBDq1ATslY",
            authDomain: "marcador-obs-6c60b.firebaseapp.com",
            databaseURL: "https://marcador-obs-6c60b-default-rtdb.firebaseio.com",
            projectId: "marcador-obs-6c60b",
            storageBucket: "marcador-obs-6c60b.firebasestorage.app",
            messagingSenderId: "411268546632",
            appId: "1:411268546632:web:67778b081df1d35e1e587d",
            measurementId: "G-257GQPG41H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('score_data');

        const stage = document.getElementById('stage');
        let currentResolutionMode = "1080p";

        function applyScaling(mode) {
            currentResolutionMode = mode || "1080p";
            let scale = 1;

            if (mode === "720p") {
                scale = 1280 / 1920; // 0.666667
            } else if (mode === "4k") {
                scale = 3840 / 1920; // 2.0
            } else if (mode === "auto") {
                // Se adapta dinámicamente según el tamaño real de la pantalla/browser en la app
                const windowWidth = window.innerWidth;
                scale = windowWidth / 1920;
            } else {
                scale = 1; // 1080p por defecto
            }

            stage.style.transform = `scale(${scale})`;
        }

        // Reajustar automáticamente si cambia el tamaño del puerto si está en modo "auto"
        window.addEventListener('resize', () => {
            if (currentResolutionMode === "auto") {
                applyScaling("auto");
            }
        });

        function broadcastToIframes(data) {
            if (!data) return;
            
            // Aplicar el cambio de escala de resolución
            applyScaling(data.resolution || "1080p");

            // Garantizamos compatibilidad enviando ambas banderas de visibilidad
            data.showIntroPlaca = data.showIntro || data.showIntroPlaca || false;

            // Guardar copia local de respaldo
            localStorage.setItem('score_master', JSON.stringify(data));

            // Notificar a cada iframe mediante postMessage
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(frame => {
                if (frame.contentWindow) {
                    frame.contentWindow.postMessage(data, '*');
                }
            });
        }

        // Escuchar datos de la nube
        db.on('value', (snapshot) => {
            broadcastToIframes(snapshot.val());
        });

        // Respaldo por BroadcastChannel
        const bc = new BroadcastChannel('sistema_obs');
        bc.onmessage = (event) => broadcastToIframes(event.data);
    </script>
</body>
</html>
