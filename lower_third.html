<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;900&display=swap');
        body { background: transparent; overflow: hidden; font-family: 'Roboto', sans-serif; color: white; margin: 0; }

        .lt-wrapper {
            position: absolute; bottom: 60px; left: 50%;
            transform: translateX(-50%) translateY(300px);
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
            opacity: 0;
        }

        .lt-wrapper.active { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Pestaña de información superior */
        .extra-info {
            background: #0097b2;
            color: white;
            font-size: 14px;
            font-weight: 400;
            padding: 4px 25px;
            border-radius: 8px 8px 0 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            margin-bottom: -2px; /* Unión perfecta con el marcador */
            display: none; /* Se activa desde JS si hay texto */
        }

        .marcador-box { display: flex; align-items: center; }

        .team-name {
            background: rgba(15, 15, 15, 0.95); padding: 20px 45px; font-size: 28px;
            text-transform: uppercase; min-width: 280px; text-align: center;
            border-bottom: 6px solid #0097b2;
            letter-spacing: 1px;
        }
        .left-side { border-radius: 15px 0 0 15px; }
        .right-side { border-radius: 0 15px 15px 0; }

        .score-box { 
            background: #0097b2; 
            padding: 10px 30px; 
            font-size: 52px; 
            z-index: 10; 
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Separador elegante */
        .separator {
            width: 3px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="lt-wrapper" class="lt-wrapper">
        <div id="extra" class="extra-info">ESTADIO CIUDAD</div>
        <div class="marcador-box">
            <div id="nra" class="team-name left-side">LOCAL</div>
            <div class="score-box">
                <span id="sa">0</span>
                <div class="separator"></div>
                <span id="sb">0</span>
            </div>
            <div id="nrb" class="team-name right-side">VISITA</div>
        </div>
    </div>

    <script>
        function updateDisplay(d) {
            if (!d) return;
            const el = document.getElementById('lt-wrapper');
            const extraEl = document.getElementById('extra');
            
            // Visibilidad
            if (d.showLT) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }

            // Info Extra (Solo se muestra si tiene contenido)
            if (d.extraLT && d.extraLT.trim() !== "") {
                extraEl.innerText = d.extraLT;
                extraEl.style.display = "block";
            } else {
                extraEl.style.display = "none";
            }

            document.getElementById('nra').innerText = d.nameA || "LOCAL";
            document.getElementById('nrb').innerText = d.nameB || "VISITA";
            document.getElementById('sa').innerText = d.scoreA || 0;
            document.getElementById('sb').innerText = d.scoreB || 0;
        }

        window.addEventListener('message', (e) => updateDisplay(e.data));
        window.addEventListener('storage', () => {
            const data = JSON.parse(localStorage.getItem('score_master'));
            if (data) updateDisplay(data);
        });
        window.onload = () => {
            const data = JSON.parse(localStorage.getItem('score_master'));
            if (data) updateDisplay(data);
        };
    </script>
</body>
</html>
